name: church_management_mobile
description: "Aplikasi mobile jemaat gereja — Flutter client untuk Church Management System (Laravel API)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Routing
  go_router: ^14.2.0

  # Environment / config
  flutter_dotenv: ^5.1.0

  # Firebase (Auth token exchange + FCM)
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.2.10

  # Local storage / session
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Functional error handling
  fpdart: ^1.1.0

  # Codegen models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI utilities
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  shimmer: ^3.0.0

  # Calendar / PDF viewer (for Jadwal & Warta)
  table_calendar: ^3.1.2
  syncfusion_flutter_pdfviewer: ^26.1.35

  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Codegen
  build_runner: ^2.4.11
  freezed: ^2.5.5
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  # fonts:
